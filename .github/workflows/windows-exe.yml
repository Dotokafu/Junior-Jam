# Elle tetiklenir: Actions → "Windows exe" → Run workflow. Godot ile tek parça (oyun verisi gömülü)
# CoFFallen.exe üretir ve çalıştırmanın Artifacts bölümüne yükler. "itch" işaretlenirse butler ile
# itch.io sayfasının "windows" kanalına güncelleme olarak da yükler. Bunun için repo ayarlarında:
#   Secrets → BUTLER_API_KEY  (itch.io → Settings → API keys)
#   Variables → ITCH_GAME     (kullanici/oyun-adi, ör. dotokafu/coffallen)
name: Windows exe

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Dosya adına eklenecek etiket (isteğe bağlı, ör. jam-teslim)"
        required: false
        default: ""
      itch:
        description: "itch.io'ya güncelleme olarak da yükle"
        type: boolean
        default: false

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: stable

jobs:
  windows:
    name: CoFFallen.exe oluştur
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Şablon paketi ~1,3 GB; Godot ve yalnızca Windows şablonu sürüm başına bir kez indirilip saklanır.
      - name: Godot'u önbellekten al
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-windows

      - name: Godot ve Windows şablonunu indir
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          tag="Godot_v${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p ~/godot
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$base/${tag}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot
          mv ~/godot/${tag}_linux.x86_64 ~/godot/godot
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/templates.tpz" "$base/${tag}_export_templates.tpz"
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          mkdir -p "$templates"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" templates/version.txt templates/windows_release_x86_64.exe -d "$templates"
          rm "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/templates.tpz"

      - name: Kaynakları içe aktar
        run: ~/godot/godot --headless --path . --import

      - name: Windows için dışa aktar
        run: |
          set -euo pipefail
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/CoFFallen.exe
          test -s build/windows/CoFFallen.exe
          ls -lh build/windows

      - uses: actions/upload-artifact@v7
        with:
          name: CoFFallen-windows${{ inputs.label != '' && format('-{0}', inputs.label) || '' }}
          path: build/windows/CoFFallen.exe
          if-no-files-found: error
          retention-days: 14

      - name: itch.io'ya yükle
        if: inputs.itch
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
          # Etiket boşsa çalıştırma numarası sürüm olur (itch sayfasında görünür).
          VERSION: ${{ inputs.label != '' && inputs.label || format('build-{0}', github.run_number) }}
        run: |
          set -euo pipefail
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "::error::Repo ayarlarında BUTLER_API_KEY sırrı ve ITCH_GAME değişkeni (kullanici/oyun-adi) tanımlı olmalı."
            exit 1
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/butler.zip" https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" push build/windows "$ITCH_GAME:windows" --userversion "$VERSION"
